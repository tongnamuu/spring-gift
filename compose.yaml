services:
  mysql:
    image: mysql:8.4.9
    environment:
      MYSQL_DATABASE: spring_gift
      MYSQL_USER: gift
      MYSQL_PASSWORD: gift
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql-data:
