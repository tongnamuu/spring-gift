spring:
  application:
    name: spring-gift
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/spring_gift}
    username: ${SPRING_DATASOURCE_USERNAME:gift}
    password: ${SPRING_DATASOURCE_PASSWORD:gift}
  jpa:
    hibernate:
      ddl-auto: validate

jwt:
  secret: ${JWT_SECRET:a-string-secret-at-least-256-bits-long}
  expiration: ${JWT_EXPIRATION:3600000}

kakao:
  login:
    client-id: ${KAKAO_CLIENT_ID:}
    client-secret: ${KAKAO_CLIENT_SECRET:}
    redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:8080/api/auth/kakao/callback}
